html{scroll-behavior:smooth}
body{font-family:'Hind Siliguri','Poppins','Noto Sans Devanagari',sans-serif;background:var(--ivory);color:var(--ink);line-height:1.55;overflow-x:hidden}

a{color:inherit;text-decoration:none}

.serif{font-family:'Noto Serif Bengali','Playfair Display',serif}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:26px}

.sh h2{font-size:29px;color:var(--maroon);margin-top:4px}
.sh p{color:var(--muted);margin-top:4px}

.step{background:#fff;border:1px solid #f0e2cf;border-radius:16px;padding:18px 14px;text-align:center}

form{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(91,15,34,.1);display:grid;gap:11px}
label{font-size:13.5px;font-weight:600;color:var(--maroon)}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid #e3d2bd;border-radius:10px;background:#fffdf9;margin-top:4px}
form button{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;background:#25D366;color:#fff;padding:13px;border-radius:30px;display:flex;justify-content:center;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--muted);text-align:center}

.box{background:#fff;border:1px solid #f0e2cf;border-radius:18px;padding:20px}

.map{border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#efe2cf,#f9f1e5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;border:1px solid #ecdcc6;text-align:center;padding:20px}
